<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workroom page editor</title>
<style>

  button[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  #stage { position:relative; flex:1; overflow:auto; display:flex; align-items:center; justify-content:center; padding:12px; }
  svg { background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.25); touch-action:none; }
  #edit { position:absolute; display:none; resize:none; border:2px solid var(--accent); padding:0; margin:0; background:#fff; color:#111; font-family:Calibri, Arial, sans-serif; line-height:1.2; overflow:hidden; }

  #status { color:var(--muted); flex:0 1 auto; min-height:18px; }

</style>
</head>
<body>
<div id="app">

  <div id="stage"><svg id="svg" tabindex="0" role="application" aria-label="Page canvas. Arrow keys move the selected item, Tab selects the next, Enter edits text."></svg><textarea id="edit" aria-label="Edit text"></textarea></div>
  <div id="side"><span id="status" role="status" aria-live="polite"></span>
    <input id="comment" type="text" maxlength="400" placeholder="Ask the agent about the selected item, then press Enter" aria-label="Comment for the agent about the selected item"></div>
  <ul id="list" aria-label="Items on the page"></ul>
</div>

      drag.origin.forEach(function (o) { var n = byId(o.id); n.x = nx + (o.x - b.x) * kx; n.y = ny + (o.y - b.y) * ky; n.w = Math.max(1, o.w * kx); n.h = Math.max(1, o.h * ky); }); drag.resized = true; render();

    else if (drag.kind === 'marquee') { drag.cur = p; ghost({ start: drag.start, cur: p, tool: 'rect' }, true); }
  });
  function ghost(d, marquee) {
    render(); var x = Math.min(d.start.x, d.cur.x), y = Math.min(d.start.y, d.cur.y), w = Math.abs(d.cur.x - d.start.x), h = Math.abs(d.cur.y - d.start.y);
    var g = d.tool === 'line' ? el('line', { x1: d.start.x, y1: d.start.y, x2: d.cur.x, y2: d.cur.y, stroke: '#2563eb', 'stroke-width': 2 / scale, 'stroke-dasharray': 4 / scale }) : el('rect', { x: x, y: y, width: w, height: h, fill: marquee ? 'rgba(37,99,235,.08)' : 'none', stroke: '#2563eb', 'stroke-width': 1.5 / scale, 'stroke-dasharray': 4 / scale });
    svg.appendChild(g);
  }
  svg.addEventListener('pointerup', function (e) {
    if (!drag || !scene) return; var d = drag; drag = null; guides = []; var p = toScene(e);
    if ((d.kind === 'move' && !d.moved) || d.kind === 'marquee') tapAt(p);
    if (d.kind === 'move' && d.moved) {
      var ops = d.origin.map(function (o) { return { op: 'update', id: o.id, set: { x: Math.round(byId(o.id).x * 100) / 100, y: Math.round(byId(o.id).y * 100) / 100 } }; });
      d.origin.forEach(function (o) { var n = byId(o.id); n.x = o.x; n.y = o.y; }); commit(ops, 'move');
    } else if (d.kind === 'resize' && d.resized) {
      var rops = d.origin.map(function (o) { var n = byId(o.id); return { op: 'update', id: o.id, set: { x: Math.round(n.x * 100) / 100, y: Math.round(n.y * 100) / 100, w: Math.round(n.w * 100) / 100, h: Math.round(n.h * 100) / 100 } }; });
      d.origin.forEach(function (o) { var n = byId(o.id); n.x = o.x; n.y = o.y; n.w = o.w; n.h = o.h; }); commit(rops, 'resize');
    } else if (d.kind === 'draw') {
      var x = Math.min(d.start.x, p.x), y = Math.min(d.start.y, p.y), w = Math.abs(p.x - d.start.x), h = Math.abs(p.y - d.start.y), id = uid(), node;
      if (d.tool === 'text') node = { id: id, type: 'text', x: x, y: y, w: Math.max(w, 160), h: Math.max(h, 40), text: 'Text', size: 28, color: '1F2937' };
      else if (d.tool === 'line') node = { id: id, type: 'line', x: d.start.x, y: d.start.y, w: p.x - d.start.x, h: p.y - d.start.y, stroke: '1F2937', stroke_w: 3 };
      else node = { id: id, type: d.tool, x: x, y: y, w: Math.max(w, 80), h: Math.max(h, 60), fill: '2563EB' };
      if (d.tool === 'line' && (node.w < 0 || node.h < 0)) { render(); }
      selection = [id]; setTool('select'); commit([{ op: 'add', node: roundNode(node) }], 'add ' + d.tool);
    } else if (d.kind === 'marquee') {
      var mx = Math.min(d.start.x, p.x), my = Math.min(d.start.y, p.y), mw = Math.abs(p.x - d.start.x), mh = Math.abs(p.y - d.start.y);
      if (mw > 3 || mh > 3) selection = scene.nodes.filter(function (n) { return n.x >= mx && n.y >= my && n.x + n.w <= mx + mw && n.y + n.h <= my + mh; }).map(function (n) { return n.id; });
      render();
    } else render();
  });
  function roundNode(n) { ['x', 'y', 'w', 'h'].forEach(function (k) { n[k] = Math.round(n[k] * 100) / 100; }); return n; }
  var lastTap = null;
  function tapAt(p) {
    var now = Date.now(), hit = null, again = lastTap && now - lastTap.t < 400 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) * scale < 6;
    lastTap = { t: now, x: p.x, y: p.y };
    if (!again) return;
    lastTap = null;
    for (var i = scene.nodes.length - 1; i >= 0 && !hit; i--) { var n = scene.nodes[i]; if (p.x >= n.x && p.x <= n.x + n.w && p.y >= n.y && p.y <= n.y + n.h && n.type === 'text') hit = n; }
    if (hit) { selection = [hit.id]; render(); startEdit(hit); }
  }

  // ---- text editing ----
  var editing = null;
  function startEdit(n) {
    editing = n.id; var r = svg.getBoundingClientRect(), st = document.getElementById('stage').getBoundingClientRect();
    edit.style.display = 'block'; edit.style.left = (r.left - st.left + document.getElementById('stage').scrollLeft + n.x * scale) + 'px'; edit.style.top = (r.top - st.top + document.getElementById('stage').scrollTop + n.y * scale) + 'px';
    edit.style.width = (n.w * scale) + 'px'; edit.style.height = Math.max(n.h * scale, 28) + 'px'; edit.style.fontSize = (num(n.size, 24) * scale) + 'px'; edit.style.fontWeight = n.bold ? '700' : '400';
    edit.value = n.text || ''; edit.focus(); edit.select();
  }
  function endEdit(save) {
    if (!editing) return; var id = editing, v = edit.value; editing = null; edit.style.display = 'none'; var n = byId(id);
    if (save && n && v !== n.text && v.length <= 2000) commit([{ op: 'update', id: id, set: { text: v } }], 'edit text'); svg.focus();
  }
  edit.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.preventDefault(); endEdit(false); } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); endEdit(true); } e.stopPropagation(); });
  edit.addEventListener('blur', function () { endEdit(true); });

  // ---- keyboard ----
  svg.addEventListener('keydown', function (e) {
    if (!scene) return; var k = e.key, step = e.shiftKey ? 10 : 1, mod = e.ctrlKey || e.metaKey;
    if (mod && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (mod && k.toLowerCase() === 'd') { e.preventDefault(); duplicate(); }
    else if (mod && k.toLowerCase() === 'a') { e.preventDefault(); selection = scene.nodes.map(function (n) { return n.id; }); render(); }
    else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); remove(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); nudge(-step, 0); } else if (k === 'ArrowRight') { e.preventDefault(); nudge(step, 0); }
    else if (k === 'ArrowUp') { e.preventDefault(); nudge(0, -step); } else if (k === 'ArrowDown') { e.preventDefault(); nudge(0, step); }
    else if (k === 'Escape') { selection = []; setTool('select'); render(); }
    else if (k === 'Enter' && selection.length === 1 && byId(selection[0]).type === 'text') { e.preventDefault(); startEdit(byId(selection[0])); }
    else if (k === 'Tab' && scene.nodes.length) { e.preventDefault(); var i = selection.length ? indexOf(selection[0]) : -1, nx = (i + (e.shiftKey ? -1 : 1) + scene.nodes.length) % scene.nodes.length; selection = [scene.nodes[nx].id]; render(); say(scene.nodes[nx].type + ' ' + scene.nodes[nx].id); }
  });
  commentEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !commentEl.value.trim()) return; e.preventDefault();
    post({ op: 'comment', node: selection[0] || '', text: commentEl.value.trim().slice(0, 400) }); commentEl.value = ''; say('Sent to the agent.');
  });

  // ---- messages from the host ----
  window.addEventListener('message', function (e) {
    if (e.source !== parent) return; var m = e.data; if (!m || typeof m !== 'object') return;
    if (m.op === 'load' && m.scene && m.scene.nodes) { scene = m.scene; rev = m.rev | 0; undoStack = []; redoStack = []; selection = []; queue = []; pending = false; fit(); say(''); }
    else if (m.op === 'ack') onAck(m); else if (m.op === 'error') onError(m); else if (m.op === 'say') say(String(m.message || '').slice(0, 160));
  });
  window.addEventListener('resize', fit);
  setTool('select'); updateButtons(); post({ op: 'ready' });
})();
</script>
</body>
