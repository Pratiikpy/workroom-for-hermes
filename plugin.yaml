name: workroom
version: 0.4.0
manifest_version: 2
api_version: 1
description: "Keeps your reports and decks in step with the numbers behind them: links each number to its source cell, shows what a change affects, updates only what must change, protects your own edits, and publishes one release you approve and can restore."
license: MIT
tags: [documents, office, verification]
requires_hermes: ">=0.23.0"
python_dependencies:
  - "lxml>=5.0,<7"
  - "python-pptx>=1.0,<2"
  - "python-docx>=1.1,<2"
  - "pypdfium2>=4.30,<6"
  - "Pillow>=10"
  - "cryptography>=42"
provides_tools:
  - workroom_status
  - workroom_add_project
  - workroom_discover
  - workroom_plan
  - workroom_explain_figure
  - workroom_selftest
  - workroom_stage_release
  - workroom_roll_forward
  - workroom_find_calculations
  - workroom_create
  - workroom_list_sources
  - workroom_instructions
  - workroom_propose_instruction
  - workroom_list_pages
  - workroom_read_page
  - workroom_edit_page
  - workroom_export_page
  - workroom_where_used
  - workroom_what_if
  - workroom_release_record
  - workroom_recipe_status
  - workroom_recipe_propose
  - workroom_room_read
  - workroom_room_add_source
  - workroom_room_remember
  - workroom_deliverable_register
  - workroom_attention
  - workroom_find_text
  - workroom_edit_text
  - workroom_verify
  - workroom_layout_check
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - post_tool_call
  - transform_tool_result
  - pre_verify
  - transform_llm_output
  - subagent_start
  - subagent_stop
config_schema:
  approvers:
    type: list
    default: []
    label: People allowed to approve releases from a messaging chat
    description: "Entries look like telegram:123456789. Local CLI and Desktop sessions are always allowed."
  proof_chat_line:
    type: boolean
    default: true
    label: Note unsourced figures under chat replies
    description: "Adds one line under a reply whose figures have no source in what the agent read this session. The reply itself is never changed."
